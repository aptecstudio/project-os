# project-os — settings for build hosts with few resources (DA-11, D-034)
#
# Second choice, to be enabled explicitly (D-036):
#   tools/build.sh --low-resources
# or, without the script:
#   kas build kas/desktop-amd64.yml:kas/dev.yml:kas/low-resources.yml
#
# Meant for a laptop with about 8 GB of RAM, 4 cores and 40-50 GB of free disk space.
# Enough for the Phase 1 image; not for WebKitGTK (Phase 2), which needs the full build
# host.

header:
  version: 14

local_conf_header:
  low-resources: |
    # Few compilation processes in parallel, so RAM does not run out
    # (2 bitbake tasks x 3 make processes = at most 6 compilations)
    BB_NUMBER_THREADS = "2"
    PARALLEL_MAKE = "-j 3"
    # Delete the work files of each finished recipe: saves tens of GB
    INHERIT += "rm_work"
    # Stop the build cleanly below 5 GB free, instead of breaking it on a full disk
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},5G,100K \
        STOPTASKS,${DL_DIR},5G,100K \
        STOPTASKS,${SSTATE_DIR},5G,100K \
        HALT,${TMPDIR},1G,1K \
        HALT,${DL_DIR},1G,1K \
        HALT,${SSTATE_DIR},1G,1K"
