# project-os — impostazioni per macchine di build con poche risorse (DA-11, D-034)
#
# Seconda scelta, da attivare esplicitamente (D-036):
#   tools/build.sh --poche-risorse
# oppure, senza lo script:
#   kas build kas/desktop-amd64.yml:kas/dev.yml:kas/low-resources.yml
#
# Pensata per un portatile con circa 8 GB di RAM, 4 core e 40-50 GB di disco liberi.
# Basta per l'immagine della Fase 1; non per WebKitGTK (Fase 2), che richiede la
# macchina di build completa.

header:
  version: 14

local_conf_header:
  low-resources: |
    # Pochi processi di compilazione in parallelo, per non esaurire la RAM
    # (2 compiti bitbake x 3 processi make = 6 compilazioni al massimo)
    BB_NUMBER_THREADS = "2"
    PARALLEL_MAKE = "-j 3"
    # Cancella i file di lavoro di ogni ricetta finita: risparmia decine di GB
    INHERIT += "rm_work"
    # Ferma la build in modo pulito sotto 5 GB liberi, invece di romperla a disco pieno
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},5G,100K \
        STOPTASKS,${DL_DIR},5G,100K \
        STOPTASKS,${SSTATE_DIR},5G,100K \
        HALT,${TMPDIR},1G,1K \
        HALT,${DL_DIR},1G,1K \
        HALT,${SSTATE_DIR},1G,1K"
