# meta-project-os — user space shared by all platforms (D-012, D-014)

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "project-os"
BBFILE_PATTERN_project-os = "^${LAYERDIR}/"
BBFILE_PRIORITY_project-os = "10"

LAYERVERSION_project-os = "1"
LAYERDEPENDS_project-os = "core"
LAYERSERIES_COMPAT_project-os = "wrynose"
