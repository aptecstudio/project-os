# project-os — distribution configuration (shared by desktop and mobile)

DISTRO = "project-os"
DISTRO_NAME = "project-os"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "phase1"
MAINTAINER = "project-os <https://github.com/aptecstudio/project-os>"

TARGET_VENDOR = "-projectos"
SDK_VENDOR = "-projectossdk"

# C library and init (D-015, D-016)
TCLIBC = "glibc"
INIT_MANAGER = "systemd"

# Distribution features. Yocto 6.0 starts from DISTRO_FEATURES_DEFAULTS and removes the
# ones listed here; each exclusion has its reason (AGENTS.md §5.5).
#   x11           Wayland only (R-03)
#   pulseaudio    audio goes through PipeWire
#   nfs           not needed on desktop and phone
#   zeroconf      no Avahi by default: an unneeded listening network service
#   3g nfc        to be re-enabled in the mobile layer, if and where needed
#   ptest         package tests: they do not go into the image
#   multiarch     no 32-bit libraries
#   debuginfod    no debug-symbol requests to the network
DISTRO_FEATURES_OPTED_OUT = "x11 pulseaudio nfs zeroconf 3g nfc ptest multiarch debuginfod"

# Additions: authentication (logind, polkit), USB peripherals, A/B updates (D-026)
DISTRO_FEATURES:append = " pam usbhost rauc"

# No syslog daemon: systemd-journald is the system log; BusyBox's syslogd would only
# duplicate it (R-02)
VIRTUAL-RUNTIME_base-utils-syslog = ""

# Hardened compiler options (stack protector, FORTIFY_SOURCE, PIE, relro): in Yocto 6.0
# defaultsetup.conf already includes them (security_flags.inc), no need to repeat it.

# Packages only as an internal build format: the image has no package manager, the
# system is updated through A/B images (D-018)
PACKAGE_CLASSES ?= "package_ipk"

# Languages: Italian and English locales for the users of the system
GLIBC_GENERATE_LOCALES = "it_IT.UTF-8 en_US.UTF-8"
IMAGE_LINGUAS = "it-it en-us"

hostname:pn-base-files = "project-os"
