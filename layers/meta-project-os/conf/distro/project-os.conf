# project-os — configurazione della distribuzione (comune a desktop e mobile)

DISTRO = "project-os"
DISTRO_NAME = "project-os"
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "fase1"
MAINTAINER = "project-os <https://github.com/aptecstudio/project-os>"

TARGET_VENDOR = "-projectos"
SDK_VENDOR = "-projectossdk"

# Libreria C e init (D-015, D-016)
TCLIBC = "glibc"
INIT_MANAGER = "systemd"

# Funzioni della distribuzione. Yocto 6.0 parte da DISTRO_FEATURES_DEFAULTS e toglie
# quelle elencate qui; ogni esclusione ha il suo motivo (AGENTS.md §5.5).
#   x11           solo Wayland (R-03)
#   pulseaudio    l'audio passa da PipeWire
#   nfs           non serve su desktop e telefono
#   zeroconf      niente Avahi per default: servizio di rete in ascolto non necessario
#   3g nfc        da riattivare nel layer mobile, se e dove serve
#   ptest         test dei pacchetti: non vanno nell'immagine
#   multiarch     niente librerie a 32 bit
#   debuginfod    nessuna richiesta di simboli di debug verso la rete
DISTRO_FEATURES_OPTED_OUT = "x11 pulseaudio nfs zeroconf 3g nfc ptest multiarch debuginfod"

# Aggiunte: autenticazione (logind, polkit), periferiche USB, aggiornamenti A/B (D-026)
DISTRO_FEATURES:append = " pam usbhost rauc"

# Opzioni di compilazione irrobustite (stack protector, FORTIFY_SOURCE, PIE, relro):
# in Yocto 6.0 le include già defaultsetup.conf (security_flags.inc), non va ripetuto.

# Pacchetti solo come formato interno di build: l'immagine non ha un gestore di
# pacchetti, il sistema si aggiorna per immagini A/B (D-018)
PACKAGE_CLASSES ?= "package_ipk"

# Lingue
GLIBC_GENERATE_LOCALES = "it_IT.UTF-8 en_US.UTF-8"
IMAGE_LINGUAS = "it-it en-us"

hostname:pn-base-files = "project-os"
