# project-os — boot menu (D-009, D-026, D-047)
#
# Chooses which copy of the system to boot (slot A or B), following RAUC's rules:
# - boot the first slot in ORDER that is valid (X_OK) and has no pending attempt
#   (X_TRY); before booting it, record the attempt (X_TRY=1);
# - if the system starts fine, rauc-mark-good clears the attempt;
# - if it does not, on reboot the attempt is still recorded and the other slot is used.
# RAUC updates these variables in grubenv when it installs an update.
# Values are 1 and 0, as RAUC writes them (not true/false: with those, after the first
# update no slot was bootable and the menu stopped waiting).
#
# Partitions (project-os-ab.wks.in): gpt2 = esp, gpt3 = root_a, gpt4 = root_b.
#
# Each slot is erofs verified by dm-verity (D-047): its root hash and tree parameters
# are in slot-A.env / slot-B.env next to grubenv, written with the slot (by the disk
# image for A, by the update bundle's hook for the slot it installs). The kernel and
# the initramfs are still read from inside the slot without verification, until step
# 4c.4 moves them to the EFI partition.

set timeout=5
set timeout_style=menu

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

# dm-verity parameters of each slot. Only the two names listed are read from the file,
# so it can set nothing else.
set A_ROOTHASH=""
set A_VERITY=""
set B_ROOTHASH=""
set B_VERITY=""
if [ -f "$prefix/slot-A.env" ]; then
    set roothash=""
    set verity_options=""
    load_env --file "$prefix/slot-A.env" roothash verity_options
    set A_ROOTHASH="$roothash"
    set A_VERITY="$verity_options"
fi
if [ -f "$prefix/slot-B.env" ]; then
    set roothash=""
    set verity_options=""
    load_env --file "$prefix/slot-B.env" roothash verity_options
    set B_ROOTHASH="$roothash"
    set B_VERITY="$verity_options"
fi
unset roothash
unset verity_options

# Disk GRUB started from (the one with the EFI partition)
regexp --set=1:disk '^([^,]+)' "$root"

# A slot without its root hash cannot be verified, so it is never chosen
set chosen=""
for SLOT in $ORDER; do
    if [ -z "$chosen" ]; then
        if [ "$SLOT" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" -a -n "$A_ROOTHASH" ]; then
            set chosen=A
            set A_TRY=1
        fi
        if [ "$SLOT" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" -a -n "$B_ROOTHASH" ]; then
            set chosen=B
            set B_TRY=1
        fi
    fi
done
save_env A_TRY B_TRY

if [ "$chosen" = "B" ]; then
    set default=slot_b
    set title_a="project-os (previous version)"
    set title_b="project-os"
elif [ "$chosen" = "A" ]; then
    set default=slot_a
    set title_a="project-os"
    set title_b="project-os (previous version)"
else
    # No slot bootable automatically: show the menu without a countdown
    set timeout=-1
    set title_a="project-os (copy A)"
    set title_b="project-os (copy B)"
fi

# Graphical theme (installed in step 5b): if missing, text menu
if [ -f "$prefix/themes/project-os/theme.txt" ]; then
    for font in $prefix/themes/project-os/*.pf2; do
        loadfont "$font"
    done
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
    set theme="$prefix/themes/project-os/theme.txt"
fi

# systemd.gpt_auto=0: partitions are mounted only as described in crypttab and the
# mount units, never by automatic type detection.
# The root file system is /dev/mapper/root: systemd-veritysetup in the initramfs opens
# it from roothash= and the slot partition (data and hash tree on the same partition).
# A block that does not match the tree gives a read error, so a corrupted system file
# stops the boot instead of running.
# systemd.crash_action=reboot: if PID 1 cannot go on (a corrupted /sbin/init, a crash),
# the PC restarts after 10 s instead of freezing, and GRUB moves to the other slot
# because the attempt is still recorded (the user's choice, D-047).
set cmdline="rootwait ro quiet console=tty0 systemd.gpt_auto=0 systemd.crash_action=reboot"
set cmdline="$cmdline root=/dev/mapper/root rootfstype=erofs"

if [ "$A_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_a" --id=slot_a {
        linux ($disk,gpt3)/boot/bzImage $cmdline rauc.slot=A \
            roothash=$A_ROOTHASH systemd.verity_root_options=$A_VERITY \
            systemd.verity_root_data=PARTLABEL=root_a systemd.verity_root_hash=PARTLABEL=root_a
        initrd ($disk,gpt3)/boot/microcode.cpio ($disk,gpt3)/boot/initramfs.cpio.zst
    }
fi
if [ "$B_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_b" --id=slot_b {
        linux ($disk,gpt4)/boot/bzImage $cmdline rauc.slot=B \
            roothash=$B_ROOTHASH systemd.verity_root_options=$B_VERITY \
            systemd.verity_root_data=PARTLABEL=root_b systemd.verity_root_hash=PARTLABEL=root_b
        initrd ($disk,gpt4)/boot/microcode.cpio ($disk,gpt4)/boot/initramfs.cpio.zst
    }
fi

# Other systems (Windows and the like): entries written by the installer with
# os-prober (step 5b)
if [ -f "$prefix/os-entries.cfg" ]; then
    source "$prefix/os-entries.cfg"
fi

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --id=fwsetup {
        fwsetup
    }
fi
