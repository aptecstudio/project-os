# project-os — boot menu (D-009, D-026, D-047, D-048)
#
# Chooses which copy of the system to boot (slot A or B), following RAUC's rules:
# - boot the first slot in ORDER that is valid (X_OK) and has no pending attempt
#   (X_TRY); before booting it, record the attempt (X_TRY=1);
# - if the system starts fine, rauc-mark-good clears the attempt;
# - if it does not, on reboot the attempt is still recorded and the other slot is used.
# RAUC updates these variables in grubenv when it installs an update.
# Values are 1 and 0, as RAUC writes them (not true/false: with those, after the first
# update no slot was bootable and the menu stopped waiting).
#
# GRUB reads only the EFI partition, never the system slots (D-048). The boot files of
# each slot are in /EFI/project-os/A and /EFI/project-os/B, written with the slot (by
# the disk image for A, by the update bundle's hook for the slot it installs):
#   project-os.efi   unified kernel image (UKI), started on UEFI with the profile of
#                    the slot (@0 for A, @1 for B): kernel, microcode, initramfs and
#                    command line, with the dm-verity root hash of the slot, are inside
#   bzImage, microcode.cpio, initramfs.cpio.zst, boot.env
#                    the same, as separate files, for the PC that boots from BIOS
#                    (step 4e); boot.env holds the two command lines

set timeout=5
set timeout_style=menu

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

set slots=/EFI/project-os

# Command line of each slot, from its own boot.env: only the name listed is read from
# the file, so it can set nothing else (cmdline_a from A's file, cmdline_b from B's)
set A_CMDLINE=""
set B_CMDLINE=""
if [ -f "$slots/A/boot.env" ]; then
    set cmdline_a=""
    load_env --file "$slots/A/boot.env" cmdline_a
    set A_CMDLINE="$cmdline_a"
fi
if [ -f "$slots/B/boot.env" ]; then
    set cmdline_b=""
    load_env --file "$slots/B/boot.env" cmdline_b
    set B_CMDLINE="$cmdline_b"
fi
unset cmdline_a
unset cmdline_b

# A slot without its boot files cannot be started (or verified), so it is never chosen
set chosen=""
for SLOT in $ORDER; do
    if [ -z "$chosen" ]; then
        if [ "$SLOT" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" -a -n "$A_CMDLINE" ]; then
            set chosen=A
            set A_TRY=1
        fi
        if [ "$SLOT" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" -a -n "$B_CMDLINE" ]; then
            set chosen=B
            set B_TRY=1
        fi
    fi
done
save_env A_TRY B_TRY

if [ "$chosen" = "B" ]; then
    set default=slot_b
    set title_a="project-os (previous version)"
    set title_b="project-os"
elif [ "$chosen" = "A" ]; then
    set default=slot_a
    set title_a="project-os"
    set title_b="project-os (previous version)"
else
    # No slot bootable automatically: show the menu without a countdown
    set timeout=-1
    set title_a="project-os (copy A)"
    set title_b="project-os (copy B)"
fi

# Graphical theme (installed in step 5b): if missing, text menu
if [ -f "$prefix/themes/project-os/theme.txt" ]; then
    for font in $prefix/themes/project-os/*.pf2; do
        loadfont "$font"
    done
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
    set theme="$prefix/themes/project-os/theme.txt"
fi

# On UEFI the UKI is started with the slot's profile: the command line inside it is
# used, any other argument is ignored (and with Secure Boot, in Phase 8, it is signed).
# From BIOS (step 4e) GRUB loads the separate files with the line from boot.env.
if [ "$A_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_a" --id=slot_a {
        if [ "$grub_platform" = "efi" ]; then
            chainloader $slots/A/project-os.efi @0
        else
            linux $slots/A/bzImage $A_CMDLINE
            initrd $slots/A/microcode.cpio $slots/A/initramfs.cpio.zst
        fi
    }
fi
if [ "$B_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_b" --id=slot_b {
        if [ "$grub_platform" = "efi" ]; then
            chainloader $slots/B/project-os.efi @1
        else
            linux $slots/B/bzImage $B_CMDLINE
            initrd $slots/B/microcode.cpio $slots/B/initramfs.cpio.zst
        fi
    }
fi

# Other systems (Windows and the like): entries written by the installer with
# os-prober (step 5b)
if [ -f "$prefix/os-entries.cfg" ]; then
    source "$prefix/os-entries.cfg"
fi

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --id=fwsetup {
        fwsetup
    }
fi
