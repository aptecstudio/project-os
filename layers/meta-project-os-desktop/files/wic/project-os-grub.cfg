# project-os — menu di avvio (D-009, D-026)
#
# Sceglie quale copia del sistema avviare (slot A o B), con le regole di RAUC:
# - si avvia il primo slot di ORDER che è valido (X_OK) e non ha un tentativo in sospeso
#   (X_TRY); prima di avviarlo si segna il tentativo (X_TRY=1);
# - se il sistema parte bene, rauc-mark-good azzera il tentativo;
# - se non parte, al riavvio il tentativo è ancora segnato e si passa all'altro slot.
# RAUC aggiorna queste variabili in grubenv quando installa un aggiornamento.
# Valori 1 e 0, come li scrive RAUC (non true/false: con quelli, dopo il primo
# aggiornamento nessuno slot risultava avviabile e il menu restava fermo).
#
# Partizioni (project-os-ab.wks.in): gpt2 = esp, gpt3 = root_a, gpt4 = root_b.

set timeout=5
set timeout_style=menu

set ORDER="A B"
set A_OK=0
set B_OK=0
set A_TRY=0
set B_TRY=0
load_env

# Disco da cui è partito GRUB (quello della partizione EFI)
regexp --set=1:disk '^([^,]+)' "$root"

set chosen=""
for SLOT in $ORDER; do
    if [ -z "$chosen" ]; then
        if [ "$SLOT" = "A" -a "$A_OK" = "1" -a "$A_TRY" = "0" ]; then
            set chosen=A
            set A_TRY=1
        fi
        if [ "$SLOT" = "B" -a "$B_OK" = "1" -a "$B_TRY" = "0" ]; then
            set chosen=B
            set B_TRY=1
        fi
    fi
done
save_env A_TRY B_TRY

if [ "$chosen" = "B" ]; then
    set default=slot_b
    set title_a="project-os (versione precedente)"
    set title_b="project-os"
elif [ "$chosen" = "A" ]; then
    set default=slot_a
    set title_a="project-os"
    set title_b="project-os (versione precedente)"
else
    # Nessuno slot avviabile in automatico: si mostra il menu senza conto alla rovescia
    set timeout=-1
    set title_a="project-os (copia A)"
    set title_b="project-os (copia B)"
fi

# Tema grafico (installato al passo 5b): se manca, menu testuale
if [ -f "$prefix/themes/project-os/theme.txt" ]; then
    for font in $prefix/themes/project-os/*.pf2; do
        loadfont "$font"
    done
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
    set theme="$prefix/themes/project-os/theme.txt"
fi

# systemd.gpt_auto=0: le partizioni si montano solo come descritto in crypttab e
# var.mount, mai per riconoscimento automatico del tipo
set cmdline="rootwait ro quiet console=tty0 systemd.gpt_auto=0"

if [ "$A_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_a" --id=slot_a {
        linux ($disk,gpt3)/boot/bzImage root=PARTLABEL=root_a rootfstype=ext4 $cmdline rauc.slot=A
    }
fi
if [ "$B_OK" = "1" -o -z "$chosen" ]; then
    menuentry "$title_b" --id=slot_b {
        linux ($disk,gpt4)/boot/bzImage root=PARTLABEL=root_b rootfstype=ext4 $cmdline rauc.slot=B
    }
fi

# Altri sistemi (Windows e simili): voci scritte dall'installer con os-prober (passo 5b)
if [ -f "$prefix/os-entries.cfg" ]; then
    source "$prefix/os-entries.cfg"
fi

if [ "$grub_platform" = "efi" ]; then
    menuentry "Impostazioni firmware UEFI" --id=fwsetup {
        fwsetup
    }
fi
