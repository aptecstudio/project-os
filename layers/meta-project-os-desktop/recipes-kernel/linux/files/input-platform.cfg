# project-os desktop — input devices and laptop platform (R-03, R-04)
# Wayland reads input from evdev devices
CONFIG_INPUT_EVDEV=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HID_MULTITOUCH=m
CONFIG_KEYBOARD_ATKBD=y
CONFIG_MOUSE_PS2=m
# Touchpads and touchscreens connected over I2C (almost all recent laptops)
CONFIG_I2C_HID_ACPI=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m
# USB 3, USB4/Thunderbolt
CONFIG_USB_XHCI_HCD=y
CONFIG_USB4=m
# Battery, AC adapter, buttons, fans, temperatures
CONFIG_ACPI_AC=m
CONFIG_ACPI_BATTERY=m
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=m
CONFIG_ACPI_THERMAL=y
# Frequency scaling of Intel and AMD processors
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_AMD_PSTATE=y
