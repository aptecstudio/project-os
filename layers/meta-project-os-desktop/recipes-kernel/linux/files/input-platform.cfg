# project-os desktop — dispositivi di input e piattaforma dei portatili (R-03, R-04)
# Wayland legge l'input dai dispositivi evdev
CONFIG_INPUT_EVDEV=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HID_MULTITOUCH=m
CONFIG_KEYBOARD_ATKBD=y
CONFIG_MOUSE_PS2=m
# Touchpad e touchscreen collegati via I2C (quasi tutti i portatili recenti)
CONFIG_I2C_HID_ACPI=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m
# USB 3, USB4/Thunderbolt
CONFIG_USB_XHCI_HCD=y
CONFIG_USB4=m
# Batteria, alimentatore, tasti, ventole, temperature
CONFIG_ACPI_AC=m
CONFIG_ACPI_BATTERY=m
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=m
CONFIG_ACPI_THERMAL=y
# Gestione della frequenza dei processori Intel e AMD
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_AMD_PSTATE=y
