# project-os desktop — input devices and laptop platform (R-03, R-04)
# Wayland reads input from evdev devices
CONFIG_INPUT_EVDEV=y
CONFIG_USB_HID=y
CONFIG_HID_GENERIC=y
CONFIG_HID_MULTITOUCH=m
CONFIG_KEYBOARD_ATKBD=y
CONFIG_MOUSE_PS2=m
# Touchpads and touchscreens connected over I2C (almost all recent laptops): the
# I2C-HID driver, the DesignWare I2C controller (core, platform and PCI front ends) and,
# on Intel, the LPSS block that exposes it. Until D-041 only I2C_HID_ACPI and
# I2C_DESIGNWARE_PLATFORM were set, and the latter was dropped for lack of its core.
CONFIG_I2C_HID_ACPI=m
CONFIG_I2C_DESIGNWARE_CORE=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m
CONFIG_I2C_DESIGNWARE_PCI=m
CONFIG_MFD_INTEL_LPSS_PCI=m
CONFIG_MFD_INTEL_LPSS_ACPI=m
# Older Intel Atom laptops and tablets (Bay Trail, Cherry Trail): LPSS clocks
CONFIG_X86_INTEL_LPSS=y
# GPIO and pin control: touchpad interrupts, buttons and sensors of laptops arrive on
# GPIO lines. Built in (=y), so the GPIO interrupts already exist when I2C-HID devices
# are probed. Consumer Intel platforms from Haswell/Bay Trail on, and AMD; the server
# platforms (Cedar Fork, Denverton, Emmitsburg, Lewisburg) are left out.
CONFIG_GPIOLIB=y
CONFIG_PINCTRL_AMD=y
CONFIG_PINCTRL_INTEL=y
CONFIG_PINCTRL_INTEL_PLATFORM=y
CONFIG_PINCTRL_LYNXPOINT=y
CONFIG_PINCTRL_BAYTRAIL=y
CONFIG_PINCTRL_CHERRYVIEW=y
CONFIG_PINCTRL_BROXTON=y
CONFIG_PINCTRL_GEMINILAKE=y
CONFIG_PINCTRL_SUNRISEPOINT=y
CONFIG_PINCTRL_CANNONLAKE=y
CONFIG_PINCTRL_ICELAKE=y
CONFIG_PINCTRL_TIGERLAKE=y
CONFIG_PINCTRL_JASPERLAKE=y
CONFIG_PINCTRL_ELKHARTLAKE=y
CONFIG_PINCTRL_ALDERLAKE=y
CONFIG_PINCTRL_METEORLAKE=y
CONFIG_PINCTRL_METEORPOINT=y
# USB 3, USB4/Thunderbolt
CONFIG_USB_XHCI_HCD=y
CONFIG_USB4=m
# Battery, AC adapter, buttons, fans, temperatures
CONFIG_ACPI_AC=m
CONFIG_ACPI_BATTERY=m
CONFIG_ACPI_BUTTON=y
CONFIG_ACPI_FAN=m
CONFIG_ACPI_THERMAL=y
# Frequency scaling of Intel and AMD processors
CONFIG_X86_INTEL_PSTATE=y
CONFIG_X86_AMD_PSTATE=y
