# project-os desktop — schede grafiche (R-04, R-08)
CONFIG_DRM=y
# Schermo dal primo istante con il framebuffer del firmware UEFI, prima del driver vero
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
# Intel: i915 (fino alla 12ª generazione) e xe (Arc e generazioni recenti)
CONFIG_DRM_I915=m
CONFIG_DRM_XE=m
# AMD: amdgpu (GCN e successive, anche le prime GCN), radeon (precedenti)
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y
CONFIG_DRM_AMD_DC=y
CONFIG_DRM_RADEON=m
# NVIDIA: driver libero nouveau (il driver proprietario non è previsto)
CONFIG_DRM_NOUVEAU=m
# Macchine virtuali: QEMU/KVM, VirtualBox, VMware, Hyper-V
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_BOCHS=m
CONFIG_DRM_QXL=m
CONFIG_DRM_VBOXVIDEO=m
CONFIG_DRM_VMWGFX=m
CONFIG_DRM_HYPERV=m
# Luminosità dello schermo dei portatili
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_ACPI_VIDEO=m
