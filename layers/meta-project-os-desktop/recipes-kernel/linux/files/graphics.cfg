# project-os desktop — graphics cards (R-04, R-38)
CONFIG_DRM=y
# Display from the first moment with the UEFI firmware framebuffer, before the real driver
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_DRM_SIMPLEDRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
# Intel: i915 (up to the 12th generation) and xe (Arc and recent generations)
CONFIG_DRM_I915=m
CONFIG_DRM_XE=m
# AMD: amdgpu (GCN and later, including the first GCN), radeon (older ones)
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMDGPU_SI=y
CONFIG_DRM_AMDGPU_CIK=y
CONFIG_DRM_AMD_DC=y
CONFIG_DRM_RADEON=m
# NVIDIA: free nouveau driver (the proprietary driver is not planned)
CONFIG_DRM_NOUVEAU=m
# Virtual machines: QEMU/KVM, VirtualBox, VMware, Hyper-V
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_BOCHS=m
CONFIG_DRM_QXL=m
CONFIG_DRM_VBOXVIDEO=m
CONFIG_DRM_VMWGFX=m
CONFIG_DRM_HYPERV=m
# Laptop screen brightness
CONFIG_BACKLIGHT_CLASS_DEVICE=y
CONFIG_ACPI_VIDEO=m
