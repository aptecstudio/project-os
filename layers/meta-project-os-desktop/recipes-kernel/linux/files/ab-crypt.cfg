# project-os desktop — A/B updates, verification and encryption (D-026)
# Device mapper: dm-crypt for the data partition, dm-verity for bundles and system
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_DM_VERITY=y
# Algorithms: AES-XTS (LUKS2 default) and SHA-256 (dm-verity)
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_HASH=y
# RAUC bundles: zstd-compressed squashfs images mounted through loop
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZSTD=y
