# project-os desktop — aggiornamenti A/B, verifica e cifratura (D-026)
# Device mapper: dm-crypt per la partizione dati, dm-verity per bundle e sistema
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_CRYPT=y
CONFIG_DM_VERITY=y
# Algoritmi: AES-XTS (LUKS2 predefinito) e SHA-256 (dm-verity)
CONFIG_CRYPTO_AES=y
CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_HASH=y
# Bundle RAUC: immagini squashfs compresse zstd montate tramite loop
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZSTD=y
