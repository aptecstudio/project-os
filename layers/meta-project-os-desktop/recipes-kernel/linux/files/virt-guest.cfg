# project-os desktop — running as a virtual machine guest (R-04, R-25, D-041)
# Everything below depends on HYPERVISOR_GUEST: without it the VMware and Hyper-V
# drivers requested in graphics.cfg were silently dropped.
CONFIG_HYPERVISOR_GUEST=y
# Paravirtualization and KVM guest support (QEMU/KVM, the test emulator)
CONFIG_PARAVIRT=y
CONFIG_PARAVIRT_SPINLOCKS=y
CONFIG_KVM_GUEST=y
# Hyper-V: core and VMBus, synthetic disk built in (=y: Generation 2 VMs boot from it
# and there is no initramfs), network, integration services (time sync, shutdown),
# memory balloon, mouse and keyboard
CONFIG_HYPERV=y
CONFIG_HYPERV_VMBUS=y
CONFIG_HYPERV_STORAGE=y
CONFIG_HYPERV_NET=m
CONFIG_HYPERV_UTILS=m
CONFIG_HYPERV_BALLOON=m
CONFIG_HID_HYPERV_MOUSE=m
CONFIG_HYPERV_KEYBOARD=m
# VMware: paravirtual SCSI disk built in (=y, boot disk without initramfs), vmxnet3
# network, VMCI and memory balloon
CONFIG_VMWARE_PVSCSI=y
CONFIG_VMXNET3=m
CONFIG_VMWARE_VMCI=m
CONFIG_VMWARE_BALLOON=m
