# project-os desktop — Bluetooth (R-04). The user-space stack is BlueZ.
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_HIDP=m
# USB and built-in adapters (Intel, Realtek, MediaTek, Broadcom, Qualcomm)
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIBTUSB_AUTOSUSPEND=y
CONFIG_BT_HCIBTUSB_BCM=y
CONFIG_BT_HCIBTUSB_RTL=y
CONFIG_BT_HCIBTUSB_MTK=y
CONFIG_BT_HCIUART=m
# Bluetooth LE keyboards and mice handled by BlueZ
CONFIG_UHID=m
