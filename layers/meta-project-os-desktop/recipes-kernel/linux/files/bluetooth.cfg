# project-os desktop — Bluetooth (R-04). Lo stack utente è BlueZ.
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_HIDP=m
# Adattatori USB e integrati (Intel, Realtek, MediaTek, Broadcom, Qualcomm)
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIBTUSB_AUTOSUSPEND=y
CONFIG_BT_HCIBTUSB_BCM=y
CONFIG_BT_HCIBTUSB_RTL=y
CONFIG_BT_HCIBTUSB_MTK=y
CONFIG_BT_HCIUART=m
# Tastiere e mouse Bluetooth LE gestiti da BlueZ
CONFIG_UHID=m
