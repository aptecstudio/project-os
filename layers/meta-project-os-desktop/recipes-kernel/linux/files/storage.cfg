# project-os desktop — disks and file systems (R-04)
# Boot drivers built into the kernel (=y): without an initramfs, the system disk must
# be readable before any module is loaded.
CONFIG_BLK_DEV_NVME=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y
# UEFI variables: needed to install and manage the boot menu
CONFIG_EFIVAR_FS=y
# USB sticks and disks, SD card readers of laptops
CONFIG_USB_STORAGE=m
CONFIG_USB_UAS=m
CONFIG_MMC=m
CONFIG_MMC_BLOCK=m
CONFIG_MMC_SDHCI=m
CONFIG_MMC_SDHCI_PCI=m
# Modules, like the rest of MMC: yocto-kernel-cache sets them to y, which is not
# possible with MMC=m and only produced a configcheck warning
CONFIG_MMC_SDHCI_ACPI=m
CONFIG_MMC_SDHCI_PLTFM=m
# Partitions of other systems (dual boot, USB sticks): Windows NTFS and exFAT
CONFIG_NTFS3_FS=m
CONFIG_EXFAT_FS=m
# zstd-compressed firmware (FIRMWARE_COMPRESSION in the machine)
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
