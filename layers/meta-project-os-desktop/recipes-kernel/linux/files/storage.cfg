# project-os desktop — dischi e file system (R-04)
# Driver per l'avvio integrati nel kernel (=y): senza initramfs, il disco di sistema
# deve essere leggibile prima di caricare qualunque modulo.
CONFIG_BLK_DEV_NVME=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_EXT4_FS=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y
CONFIG_NLS_UTF8=y
# Variabili UEFI: servono per installare e gestire il menu di avvio
CONFIG_EFIVAR_FS=y
# Chiavette e dischi USB, lettori di schede SD dei portatili
CONFIG_USB_STORAGE=m
CONFIG_USB_UAS=m
CONFIG_MMC=m
CONFIG_MMC_BLOCK=m
CONFIG_MMC_SDHCI=m
CONFIG_MMC_SDHCI_PCI=m
# Partizioni di altri sistemi (dual boot, chiavette): Windows NTFS ed exFAT
CONFIG_NTFS3_FS=m
CONFIG_EXFAT_FS=m
# Firmware compressi con zstd (FIRMWARE_COMPRESSION nella macchina)
CONFIG_FW_LOADER_COMPRESS=y
CONFIG_FW_LOADER_COMPRESS_ZSTD=y
