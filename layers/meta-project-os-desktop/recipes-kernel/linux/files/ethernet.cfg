# project-os desktop — wired network (R-04)
CONFIG_NET_VENDOR_INTEL=y
CONFIG_E1000=m
CONFIG_E1000E=m
CONFIG_IGB=m
CONFIG_IGC=m
CONFIG_NET_VENDOR_REALTEK=y
CONFIG_R8169=m
CONFIG_NET_VENDOR_BROADCOM=y
CONFIG_TIGON3=m
# Most common USB-Ethernet adapters
CONFIG_USB_RTL8152=m
CONFIG_USB_NET_CDCETHER=m
CONFIG_USB_NET_AX88179_178A=m
# Virtual machines
CONFIG_VIRTIO_NET=m
