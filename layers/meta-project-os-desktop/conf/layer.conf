# meta-project-os-desktop — desktop amd64 hardware layer (D-014)

BBPATH .= ":${LAYERDIR}"
# Path of this layer, for files that tasks must track (e.g. the boot menu, machine
# configuration). ":=" because LAYERDIR is set only while this file is read.
PROJECT_OS_DESKTOP_LAYERDIR := "${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "project-os-desktop"
BBFILE_PATTERN_project-os-desktop = "^${LAYERDIR}/"
BBFILE_PRIORITY_project-os-desktop = "11"
# The layer may contain only bbappends and machine configuration
BBFILE_PATTERN_IGNORE_EMPTY_project-os-desktop = "1"

LAYERVERSION_project-os-desktop = "1"
LAYERDEPENDS_project-os-desktop = "core project-os"
LAYERSERIES_COMPAT_project-os-desktop = "wrynose"
