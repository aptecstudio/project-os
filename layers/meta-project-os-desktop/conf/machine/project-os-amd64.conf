#@TYPE: Machine
#@NAME: project-os desktop amd64
#@DESCRIPTION: PC desktop e portatili Intel/AMD a 64 bit, con firmware UEFI o BIOS

# Istruzioni x86-64 di base: funziona su tutti i processori a 64 bit, dal 2003 in poi
# (retrocompatibilità, R-25; D-027). Sostituisce x86-64-v2 (corei7-64) scelto in D-024.
DEFAULTTUNE ?= "x86-64"
require conf/machine/include/x86/arch-x86.inc

MACHINE_FEATURES += "efi pcbios pci acpi usbhost alsa bluetooth wifi screen keyboard rtc vfat ext2 x86"

# Kernel: linux-yocto 6.18 LTS, cioè il kernel ufficiale con poche patch Yocto (D-014)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.18%"
KERNEL_IMAGETYPE = "bzImage"

# Tutti i moduli del kernel e i firmware dell'hardware moderno (R-04, D-025)
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules packagegroup-project-os-desktop-hw"

# Firmware compressi con zstd: molto più leggeri, il kernel li decomprime al caricamento
FIRMWARE_COMPRESSION = "zst"

# Avvio con GRUB (D-009) e schema di partizioni A/B (D-026).
# Il kernel sta dentro ciascuno slot di sistema (/boot/bzImage): GRUB lo legge dallo
# slot scelto. L'avvio da BIOS si aggiunge al passo 4e (R-26).
EFI_PROVIDER = "grub-efi"
IMAGE_FSTYPES += "wic wic.bmap"
WKS_FILE ?= "project-os-ab.wks.in"

# Moduli di GRUB inclusi nell'eseguibile EFI: partizioni GPT, file system FAT/ext4,
# variabili per la scelta dello slot (loadenv), menu grafico con tema, firmware UEFI
GRUB_BUILDIN = " \
    boot linux normal configfile echo test regexp sleep reboot halt \
    part_gpt part_msdos fat ext2 search search_label search_fs_uuid probe \
    loadenv chain efifwsetup \
    gfxterm gfxterm_background gfxmenu png font all_video efi_gop \
"

# File aggiunti alla partizione EFI: menu di avvio e stato iniziale degli slot
IMAGE_EFI_BOOT_FILES += "project-os/grubenv;EFI/BOOT/grubenv"
do_image_wic[depends] += "project-os-boot-config:do_deploy"

SERIAL_CONSOLES ?= "115200;ttyS0"

# Prova in QEMU: con tools/run-qemu.sh (q35, processore qemu64 = x86-64 di base),
# non con runqemu di Yocto. Niente qemuboot-x86.inc: la sua classe qemuboot fa
# costruire QEMU con la grafica, e con lui Mesa, LLVM e Clang (D-035).

# Aggiornamenti A/B (D-026): RAUC aggiorna lo stato degli slot in grubenv con
# grub-editenv. meta-rauc lo deduce da PREFERRED_PROVIDER_virtual/bootloader, che su
# questa macchina non è impostato: lo indichiamo esplicitamente.
RAUC_BOOTLOADER_RDEPENDS:pn-rauc = "grub-editenv"
MACHINE_EXTRA_RRECOMMENDS += "project-os-storage"
