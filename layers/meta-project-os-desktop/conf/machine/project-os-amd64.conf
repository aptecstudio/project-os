#@TYPE: Machine
#@NAME: project-os desktop amd64
#@DESCRIPTION: 64-bit Intel/AMD desktop PCs and laptops, with UEFI or BIOS firmware

# Baseline x86-64 instructions: works on every 64-bit processor, from 2003 onwards
# (backward compatibility, R-25; D-027). Replaces x86-64-v2 (corei7-64) chosen in D-024.
DEFAULTTUNE ?= "x86-64"
require conf/machine/include/x86/arch-x86.inc

MACHINE_FEATURES += "efi pcbios pci acpi usbhost alsa bluetooth wifi screen keyboard rtc vfat ext2 x86"

# Kernel: linux-yocto 6.18 LTS, i.e. the upstream kernel with few Yocto patches (D-014)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.18%"
KERNEL_IMAGETYPE = "bzImage"

# All kernel modules and the firmware for modern hardware (R-04, D-025)
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules packagegroup-project-os-desktop-hw"

# zstd-compressed firmware: much lighter, the kernel decompresses it when loading
FIRMWARE_COMPRESSION = "zst"

# Boot with GRUB (D-009) and A/B partition layout (D-026).
# The kernel lives inside each system slot (/boot/bzImage): GRUB reads it from the
# chosen slot. BIOS boot is added in step 4e (R-26).
EFI_PROVIDER = "grub-efi"
# wic: full disk for the first installation; ext4: image of the slot alone, which the
# RAUC update bundle (project-os-bundle) writes into the inactive slot
IMAGE_FSTYPES += "wic wic.bmap ext4"
WKS_FILE ?= "project-os-ab.wks.in"

# GRUB modules built into the EFI executable: GPT partitions, FAT/ext4 file systems,
# variables for slot selection (loadenv), themed graphical menu, UEFI firmware
GRUB_BUILDIN = " \
    boot linux normal configfile echo test regexp sleep reboot halt \
    part_gpt part_msdos fat ext2 search search_label search_fs_uuid probe \
    loadenv chain efifwsetup \
    gfxterm gfxterm_background gfxmenu png font all_video efi_gop \
"

# Early CPU microcode for Intel and AMD, loaded by GRUB before the initramfs (step 3b,
# D-043)
PROJECT_OS_EARLY_INITRD = "project-os/microcode.cpio"
PROJECT_OS_EARLY_INITRD_DEPENDS = "project-os-microcode:do_deploy"

# Files added to the EFI partition: boot menu and initial slot state
IMAGE_EFI_BOOT_FILES += "project-os/grubenv;EFI/BOOT/grubenv"
do_image_wic[depends] += "project-os-boot-config:do_deploy"

SERIAL_CONSOLES ?= "115200;ttyS0"

# Testing in QEMU: with tools/run-qemu.sh (q35, qemu64 processor = baseline x86-64),
# not with Yocto's runqemu. No qemuboot-x86.inc: its qemuboot class makes bitbake
# build QEMU with graphics, and with it Mesa, LLVM and Clang (D-035).

# A/B updates (D-026): RAUC updates the slot state in grubenv with grub-editenv.
# meta-rauc infers it from PREFERRED_PROVIDER_virtual/bootloader, which is not set on
# this machine: we state it explicitly.
RAUC_BOOTLOADER_RDEPENDS:pn-rauc = "grub-editenv"
MACHINE_EXTRA_RRECOMMENDS += "project-os-storage"
