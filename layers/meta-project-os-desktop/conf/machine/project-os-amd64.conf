#@TYPE: Machine
#@NAME: project-os desktop amd64
#@DESCRIPTION: PC desktop e portatili Intel/AMD a 64 bit con firmware UEFI

# Istruzioni di base x86-64-v2 (corei7-64): funziona sui processori dal 2008 in poi.
# Scelta più ampia di x86-64-v3, che escluderebbe i PC precedenti al 2013 circa (D-024).
DEFAULTTUNE ?= "corei7-64"
require conf/machine/include/x86/tune-corei7.inc
require conf/machine/include/x86/qemuboot-x86.inc

MACHINE_FEATURES += "efi pci acpi usbhost alsa bluetooth wifi screen keyboard rtc vfat ext2 x86"

# Kernel: linux-yocto 6.18 LTS, cioè il kernel ufficiale con poche patch Yocto (D-014)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.18%"
KERNEL_IMAGETYPE = "bzImage"

# Tutti i moduli del kernel e i firmware dell'hardware moderno (R-04, D-025)
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules packagegroup-project-os-desktop-hw"

# Firmware compressi con zstd: molto più leggeri, il kernel li decomprime al caricamento
FIRMWARE_COMPRESSION = "zst"

# Avvio UEFI con GRUB (D-009); lo schema A/B arriva al passo 4
EFI_PROVIDER = "grub-efi"
IMAGE_FSTYPES += "wic wic.bmap"
WKS_FILE ?= "project-os-efi.wks"

SERIAL_CONSOLES ?= "115200;ttyS0"

# Prova in QEMU (runqemu)
QB_MACHINE = "-machine q35"
QB_CPU = "-cpu Nehalem"
QB_CPU_KVM = "-cpu host"
QB_MEM = "-m 2048"
QB_DEFAULT_FSTYPE = "wic"
