#@TYPE: Machine
#@NAME: project-os desktop amd64
#@DESCRIPTION: 64-bit Intel/AMD desktop PCs and laptops, with UEFI or BIOS firmware

# Baseline x86-64 instructions: works on every 64-bit processor, from 2003 onwards
# (backward compatibility, R-25; D-027). Replaces x86-64-v2 (corei7-64) chosen in D-024.
DEFAULTTUNE ?= "x86-64"
require conf/machine/include/x86/arch-x86.inc

MACHINE_FEATURES += "\
    efi pcbios pci acpi usbhost alsa bluetooth wifi screen keyboard rtc vfat ext2 x86 \
"

# Kernel: linux-yocto 6.18 LTS, i.e. the upstream kernel with few Yocto patches (D-014)
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.18%"
KERNEL_IMAGETYPE = "bzImage"
# The kernel boots from the EFI partition (D-048), not from the system slot: the
# modules must not bring the kernel image into the slot through kernel-base
RRECOMMENDS:${KERNEL_PACKAGE_NAME}-base:pn-linux-yocto = ""

# All kernel modules and the firmware for modern hardware (R-04, D-025)
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules packagegroup-project-os-desktop-hw"

# zstd-compressed firmware: much lighter, the kernel decompresses it when loading
FIRMWARE_COMPRESSION = "zst"

# Boot with GRUB (D-009) and A/B partition layout (D-026). BIOS boot is added in step
# 4e (R-26).
EFI_PROVIDER = "grub-efi"
# System slot (steps 4c.3 and 4c.4, D-047, D-048): erofs compressed with lz4hc, with
# the dm-verity hash tree appended (erofs-lz4hc.verity): the image that wic writes into
# slot A and that the RAUC update bundle (project-os-bundle) writes into the inactive
# slot. wic: full disk for the first installation.
# The slot holds no kernel: kernel, initramfs and command line are on the EFI
# partition, built by project_os_slot_boot (a UKI for UEFI, separate files for BIOS).
# lz4hc: the user's choice (D-048), decompression fast even on old processors (R-25);
# default 4 KiB clusters, so a random read decompresses one block at most.
IMAGE_CLASSES += "image_types_verity project_os_slot_boot"
IMAGE_FSTYPES += "erofs-lz4hc verity wic wic.bmap"
VERITY_IMAGE_FSTYPE = "erofs-lz4hc"
# Salt of the hash tree: fixed, so the same system gives the same root hash; it only
# has to differ from the one of other projects (meta-oe's default)
VERITY_SALT = "f971fbadb5c7b3736ba5ddc3cf9ef201bc54d63bd02915829a844636ced69a40"
WKS_FILE ?= "project-os-ab.wks.in"
# The boot menu reaches wic through the "bootloader --configfile" line, which bitbake
# does not track: without this, a change to the menu alone did not rebuild the disk
do_image_wic[file-checksums] += "${PROJECT_OS_DESKTOP_LAYERDIR}/files/wic/project-os-grub.cfg:True"

# GRUB modules built into the EFI executable: GPT partitions, FAT file system (GRUB
# reads only the EFI partition), variables for slot selection (loadenv), chainloader
# for the UKI, themed graphical menu, UEFI firmware
GRUB_BUILDIN = " \
    boot linux normal configfile echo test sleep reboot halt \
    part_gpt part_msdos fat search search_label search_fs_uuid probe \
    loadenv chain efifwsetup \
    gfxterm gfxterm_background gfxmenu png font all_video efi_gop \
"

# Early CPU microcode for Intel and AMD, before the initramfs in the UKI and in GRUB's
# BIOS entries (step 3b, D-043)
PROJECT_OS_EARLY_INITRD = "project-os/microcode.cpio"
PROJECT_OS_EARLY_INITRD_DEPENDS = "project-os-microcode:do_deploy"

# Kernel command line of both slots; project_os_slot_boot adds the root hash and the
# slot's own part (partition label, rauc.slot).
#   systemd.gpt_auto=0      partitions are mounted only as described in crypttab and
#                           the mount units, never by automatic type detection
#   root=/dev/mapper/root   systemd-veritysetup in the initramfs opens it from roothash=
#                           and the slot partition; a block that does not match the tree
#                           gives a read error, so a corrupted system file is not run
#   systemd.crash_action=reboot
#                           if PID 1 cannot go on (a corrupted /sbin/init, a crash) the
#                           PC restarts after 10 s instead of freezing, and GRUB moves to
#                           the other slot because the attempt is still recorded (D-047)
PROJECT_OS_KERNEL_CMDLINE = "\
    rootwait ro quiet console=tty0 systemd.gpt_auto=0 systemd.crash_action=reboot \
    root=/dev/mapper/root rootfstype=erofs \
"

# initramfs: encrypted data partition and persistent /etc overlay (D-044)
PROJECT_OS_INITRD_INSTALL = "project-os-storage-initrd"

# Files added to the EFI partition: initial slot state, and the boot files of slot A,
# built by project_os_slot_boot next to the slot image (D-048)
IMAGE_EFI_BOOT_FILES += "project-os/grubenv;EFI/BOOT/grubenv"
IMAGE_EFI_BOOT_FILES += "${IMGDEPLOYDIR}/${IMAGE_LINK_NAME}.slot-boot/*;EFI/project-os/A"
do_image_wic[depends] += "project-os-boot-config:do_deploy"

SERIAL_CONSOLES ?= "115200;ttyS0"

# Testing in QEMU: with tools/run-qemu.sh (q35, qemu64 processor = baseline x86-64),
# not with Yocto's runqemu. No qemuboot-x86.inc: its qemuboot class makes bitbake
# build QEMU with graphics, and with it Mesa, LLVM and Clang (D-035).

# A/B updates (D-026): RAUC updates the slot state in grubenv with grub-editenv.
# meta-rauc infers it from PREFERRED_PROVIDER_virtual/bootloader, which is not set on
# this machine: we state it explicitly.
RAUC_BOOTLOADER_RDEPENDS:pn-rauc = "grub-editenv"
MACHINE_EXTRA_RRECOMMENDS += "project-os-storage"
