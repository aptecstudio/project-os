# project-os desktop — RAUC configuration (D-018, D-026, D-047)
# Two copies of the system (slots A and B); GRUB chooses which one to boot from grubenv.

[system]
compatible=project-os-amd64
bootloader=grub
grubenv=/efi/EFI/BOOT/grubenv
# RAUC state on the data partition, not on the read-only system
data-directory=/var/lib/rauc
# Only bundles with a verified format (dm-verity): no "plain" bundles
bundle-formats=-plain

[handlers]
# After installing an update: report the /etc overlay files changed both locally and by
# the update (D-044). It never makes the installation fail.
post-install=/usr/lib/project-os/etc-overlay-conflicts

[keyring]
# Certificate of the CA that signs updates (in /usr/lib/rauc)
path=ca.cert.pem

# System slots (D-047): erofs + dm-verity hash tree, written as it is (raw)
[slot.rootfs.0]
device=/dev/disk/by-partlabel/root_a
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/root_b
type=raw
bootname=B
