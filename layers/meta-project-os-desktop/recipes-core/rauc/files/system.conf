# project-os desktop — configurazione di RAUC (D-018, D-026)
# Due copie del sistema (slot A e B); GRUB sceglie quale avviare leggendo grubenv.

[system]
compatible=project-os-amd64
bootloader=grub
grubenv=/efi/EFI/BOOT/grubenv
# Stato di RAUC sulla partizione dati, non sul sistema in sola lettura
data-directory=/var/lib/rauc
# Solo bundle con formato verificato (dm-verity): niente bundle "plain"
bundle-formats=-plain

[keyring]
# Certificato della CA che firma gli aggiornamenti (in /usr/lib/rauc)
path=ca.cert.pem

[slot.rootfs.0]
device=/dev/disk/by-partlabel/root_a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/root_b
type=ext4
bootname=B
