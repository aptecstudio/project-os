# project-os — data partition, created by systemd-repart on first boot (D-026)
# Takes all the free disk space after the system slots.
#
# LUKS2 encryption with an EMPTY key: it is a placeholder. The setup (Phase 8) enrolls
# the user's password and the recovery key (and the TPM, if present) and removes the
# empty key. Until that happens, the data is NOT protected.

[Partition]
Type=var
Label=data
Format=ext4
Encrypt=key-file
SizeMinBytes=2G
FactoryReset=no
