# project-os — partizione dati, creata da systemd-repart al primo avvio (D-026)
# Occupa tutto lo spazio libero del disco dopo gli slot di sistema.
#
# Cifratura LUKS2 con chiave VUOTA: è un segnaposto. Il setup (Fase 8) registra la
# password dell'utente e la chiave di recupero (e il TPM, se c'è) ed elimina la chiave
# vuota. Finché non succede, i dati NON sono protetti.

[Partition]
Type=var
Label=data
Format=ext4
Encrypt=key-file
SizeMinBytes=2G
FactoryReset=no
